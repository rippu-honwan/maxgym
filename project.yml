# XcodeGen spec. Run `xcodegen` to generate MaxGym.xcodeproj (gitignored).
name: MaxGym
options:
  bundleIdPrefix: com.kenlip
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

packages:
  MaxGymCore:
    path: MaxGymCore

targets:
  MaxGym:
    type: application
    platform: iOS
    sources: [iOS]
    scheme: {} # shared scheme, so Xcode and xcodebuild always see it
    dependencies:
      - target: MaxGymWatch # embeds the watch app in the iPhone app
      - package: MaxGymCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenlip.MaxGym
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: MaxGym
        UILaunchScreen: {}

  MaxGymWatch:
    type: application
    platform: watchOS
    sources: [Watch]
    scheme: {}
    dependencies:
      - package: MaxGymCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kenlip.MaxGym.watchkitapp
        PRODUCT_NAME: MaxGym
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: MaxGym
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.kenlip.MaxGym
        WKBackgroundModes: [workout-processing] # keep recording with the wrist down
        NSHealthShareUsageDescription: Reads heart rate to store with your workouts.
        NSHealthUpdateUsageDescription: Saves strength training workouts to the Health app.
        NSMotionUsageDescription: Records wrist motion for each set to train the rep counter.
    entitlements:
      path: Watch/MaxGymWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
